services:
  # Frontend - Vite React Static Site
  - type: web
    name: ecommerce-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist

  # Backend - Node.js API
  - type: web
    name: ecommerce-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js  # Change if your entry file is different (e.g., app.js or server.js)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # or your backend port
      # Add your actual environment variables like DB_URI, JWT_SECRET, etc.
